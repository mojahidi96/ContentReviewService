# Local development stack: MongoDB + the API (with the in-process worker).
# The Python LLM service lives in a separate repository. By default the API uses the built-in
# mock client; to use the real service set PYTHON_LLM_MODE=http and AI_SERVICE_BASE_URL
# (e.g. http://host.docker.internal:8000) in your shell or an .env file next to this file.
name: content-review

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    # Prometheus metrics: reachable on the compose network only, never published to the host.
    expose:
      - '9464'
    environment:
      # Development-only values. Production must use a secret manager (see README).
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: info
      LOG_FORMAT: json
      METRICS_PORT: 9464
      MONGODB_URI: mongodb://mongo:27017/content_review
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
      CSRF_SECRET: ${CSRF_SECRET:-dev-only-csrf-secret-change-me-0123456789abcdef}
      AUTH_COOKIE_SECURE: 'false'
      PYTHON_LLM_MODE: ${PYTHON_LLM_MODE:-mock}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://host.docker.internal:8000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Optional dedicated worker: `docker compose --profile worker up`.
  # When used, set WORKER_ENABLED=false on `api` to separate HTTP and processing.
  worker:
    profiles: ['worker']
    build: .
    command: ['node', 'dist/worker.js']
    expose:
      - '9464'
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: development
      LOG_FORMAT: json
      METRICS_PORT: 9464
      MONGODB_URI: mongodb://mongo:27017/content_review
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
      CSRF_SECRET: ${CSRF_SECRET:-dev-only-csrf-secret-change-me-0123456789abcdef}
      PYTHON_LLM_MODE: ${PYTHON_LLM_MODE:-mock}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://host.docker.internal:8000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # --- Observability (local only): `docker compose --profile observability up` ---------------
  # Grafana http://localhost:3001 · Prometheus http://localhost:9090
  prometheus:
    profiles: ['observability']
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'

  loki:
    profiles: ['observability']
    image: grafana/loki:3.7.8
    command: ['-config.file=/etc/loki/loki-config.yml']
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  alloy:
    profiles: ['observability']
    image: grafana/alloy:v1.20.1
    command: ['run', '--storage.path=/var/lib/alloy/data', '/etc/alloy/config.alloy']
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Development only: lets Alloy read container logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    profiles: ['observability']
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/content-review-service.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - prometheus
      - loki

volumes:
  mongo-data:
  prometheus-data:
  loki-data:
  grafana-data:
